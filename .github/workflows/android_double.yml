name: Android Double Templates

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Godot Engine
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Build Android Template (Double)
        run: |
          scons platform=android target=template_release precision=double arch=arm64 ANDROID_HOME=$ANDROID_HOME

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-template-double
          path: bin/android_release.apk
